<html lang="hu"><head>

<title>Konvoj</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;background:#0b0d17;color:#fff;font-family:-apple-system,system-ui,sans-serif}
#map{position:fixed;inset:0}
.box{position:fixed;z-index:1000;background:#0b0d17e6;border:1px solid #6d5cff;border-radius:16px}
#speed{left:12px;bottom:calc(140px + env(safe-area-inset-bottom));width:100px;padding:10px 0;text-align:center}
#speed b{font-size:44px;display:block}#speed.over{background:#c1121f}
#alert{top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;padding:14px;text-align:center;font-size:20px;font-weight:700;background:#c1121f;display:none}
#status{right:12px;bottom:calc(140px + env(safe-area-inset-bottom));max-width:55%;padding:8px 10px;font-size:12px}
#bar{position:fixed;z-index:1000;left:8px;right:8px;bottom:calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{padding:14px 4px;border:0;border-radius:14px;background:#6d5cff;color:#fff;font-size:14px;font-weight:700}
.pin{font-size:24px;line-height:30px;text-align:center}
#map{background:#1b1e22}
.leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(1.15)}
#search{position:fixed;z-index:1001;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:6px}
#q{flex:1;min-width:0;padding:12px;font-size:16px;border-radius:14px;border:1px solid #6d5cff;background:#0b0d17e6;color:#fff}
#search button{padding:0 14px}
#alert{top:calc(70px + env(safe-area-inset-top))}
#nav{top:calc(140px + env(safe-area-inset-top));left:12px;padding:8px 12px;font-weight:700;display:none}
.pin{font-size:18px;background:#0b0d17;border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px #000}
.arrow{width:0;height:0}
.arrow div{width:30px;height:34px;margin:-17px 0 0 -15px;background:#fff;clip-path:polygon(50% 0,100% 100%,50% 76%,0 100%);filter:drop-shadow(0 0 4px #000)}
.dest div{width:22px;height:22px;margin:-11px 0 0 -11px;background:#d94bff;border:3px solid #fff;transform:rotate(45deg);box-shadow:0 0 14px #d94bff}
.dest{width:0;height:0}
#dock{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom))}
#bar{position:static;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:6px 2px;background:#12141cf2;border:1px solid #ffffff1f;border-radius:22px;box-shadow:0 8px 24px #0008}
#bar button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:8px 0;background:none;border-radius:16px;color:#e8e8f0;font-size:10.5px;font-weight:600;white-space:nowrap}
#bar button:active{background:#ffffff1a}
#bar svg{width:24px;height:24px;fill:none;stroke:#b9aeff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#help svg{stroke:#ffb020!important}#help.on{background:#c1121f}#help.on svg{stroke:#fff!important}
#go{display:block;width:100%;margin-bottom:10px;padding:16px;border-radius:18px;font-size:18px;background:linear-gradient(90deg,#6d5cff,#d94bff);box-shadow:0 6px 20px #6d5cff80}
#speed{width:84px;height:84px;padding:0;border-radius:50%;border:4px solid #6d5cff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;bottom:calc(172px + env(safe-area-inset-bottom))}
#speed b{font-size:32px;line-height:1}
#status{bottom:calc(172px + env(safe-area-inset-bottom));border-color:#ffffff1f}
.leaflet-bottom{bottom:calc(160px + env(safe-area-inset-bottom))}
body.driving #speed,body.driving #status,body.driving .leaflet-bottom{bottom:calc(98px + env(safe-area-inset-bottom))}
body.driving #go{display:none}
#panel{position:fixed;z-index:1100;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:#12141c;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px #000a}
#panel[hidden]{display:none}
#panel .head{display:flex;justify-content:space-between;align-items:center}#panel h2{margin:0}#panel h3{font-size:15px;margin:16px 0 8px}
#panel p{color:#b8b8c8;font-size:14px}
#panel input{box-sizing:border-box;width:100%;margin-top:10px;padding:13px;font-size:16px;border-radius:14px;border:1px solid #ffffff2a;background:#0b0d17;color:#fff}
#panel button{display:block;width:100%;margin-top:10px;background:#262a38}
#panel button.main{background:linear-gradient(90deg,#6d5cff,#d94bff)}#panel button.x{width:40px;margin:0}#panel button.leave{background:none;color:#ff6b6b}
#panel code{display:block;margin-top:12px;font-size:17px;letter-spacing:1px;word-break:break-all;color:#b9aeff}
#panel .member{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px;text-align:left;background:#1c1f2b;border-radius:14px}
#panel .member small{display:block;margin-top:3px;color:#b8b8c8;font-weight:400}#panel .member.sos{background:#7a0f18}
.leaflet-attribution-flag{display:none!important}
.leaflet-container .leaflet-control-attribution{background:transparent;color:#ffffff66;font-size:9px}
.leaflet-container .leaflet-control-attribution a{color:#ffffff66;text-decoration:none}
</style></head><body>
<div id="map"></div>
<div id="panel" hidden></div>
<form id="search"><input id="q" placeholder="Hova mész?" enterkeyhint="search"><button>Keresés</button><button type="button" id="center">◎</button></form>
<div id="nav" class="box"></div>
<div id="alert" class="box"></div>
<div id="speed" class="box"><b id="kmh">–</b>km/h<div id="lim"></div></div>
<div id="status" class="box">Nyomd meg az Indulás gombot.</div>
<div id="dock"><button id="go">Indulás</button><div id="bar"><button id="addCam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Trafi</span></button><button id="addGate"><svg viewBox="0 0 24 24"><path d="M4 21V5h16v16M4 9h16M9 9v3M15 9v3"/></svg><span>Kapu</span></button><button id="setLim"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg><span>Limit</span></button><button id="meet"><svg viewBox="0 0 24 24"><path d="M6 21V4h12l-3 4 3 4H6"/></svg><span>Találka</span></button><button id="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-8 12-8 12 0M16 5a3.5 3.5 0 010 7M18 14c2 1 3 3 3 6"/></svg><span>Csapat</span></button><button id="help"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"/></svg><span>Gond van</span></button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// IDE írd be a saját Firebase Realtime Database címedet, a végén perjel nélkül:
const DB_URL='';
const $=id=>document.getElementById(id);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const map=L.map('map',{zoomControl:false,tapHold:true}).setView([47.955,22.323],13);
map.attributionControl.setPrefix(false);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const icon=t=>L.divIcon({className:'pin',html:t==='gate'?'🚧':'📸',iconSize:[30,30]});
let mine=load('konvoj.pins',[]),osm=[],pos=null,last=null,heading=null,limit=load('konvoj.limit',0),lastFetch=null,fetching=false,audio=null,watching=false;
const warned=new Map(),layer=L.layerGroup().addTo(map);let me=null;
function dist(a,b){const r=Math.PI/180,x=(b.lat-a.lat)*r,y=(b.lon-a.lon)*r;const h=Math.sin(x/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return(Math.atan2(y,x)/r+360)%360}
function draw(){layer.clearLayers();
 osm.forEach(p=>L.marker([p.lat,p.lon],{icon:icon(p.type)}).bindPopup('Térképadat (OpenStreetMap)').addTo(layer));
 mine.forEach((p,i)=>{const b=document.createElement('button');b.textContent='Törlés';b.onclick=()=>{mine.splice(i,1);save('konvoj.pins',mine);map.closePopup();draw()};
  L.marker([p.lat,p.lon],{icon:icon(p.type)}).bindPopup(b).addTo(layer)})}
async function fetchCams(){if(fetching||(lastFetch&&dist(lastFetch,pos)<10000))return;fetching=true;
 const a=`(around:30000,${pos.lat},${pos.lon})`;
 const q=`[out:json][timeout:25];(node["highway"="speed_camera"]${a};rel["type"="enforcement"]${a};);out body;node(r:"device");out body;`;
 try{const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw 0;const j=await r.json();
  osm=j.elements.filter(e=>e.type==='node').map(e=>({lat:e.lat,lon:e.lon,type:'cam'}));lastFetch=pos;draw();$('status').textContent=osm.length+' ismert mérőpont 30 km-en belül. A lista nem teljes!'}
 catch(e){$('status').textContent='A mérőpontok letöltése nem sikerült, újrapróbálom.';await new Promise(s=>setTimeout(s,20000))}
 fetching=false}
function beep(){if(!audio)return;const o=audio.createOscillator();o.connect(audio.destination);o.frequency.value=880;o.start();o.stop(audio.currentTime+.4)}
function check(){let near=null;
 [...osm,...mine].forEach(p=>{const d=dist(pos,p);if(d>600)return;
  if(heading!=null){const diff=Math.abs((bearing(pos,p)-heading+540)%360-180);if(diff>60&&d>40)return}
  if(!near||d<near.d)near={...p,d}});
 if(!near){$('alert').style.display='none';return}
 const name=near.type==='gate'?'Kapu':'Traffipax';$('alert').style.display='block';$('alert').textContent=`${name} ${Math.round(near.d/10)*10} m`;
 const key=near.lat+','+near.lon;if(Date.now()-(warned.get(key)||0)>120000){warned.set(key,Date.now());beep();
  if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(name+' előtted');u.lang='hu-HU';speechSynthesis.speak(u)}}}
// Sebesség-simítás: kiszűri a GPS ugrásait
let track=[],samples=[],smooth=null,lastOk=0;
function speedKmh(c,t,p){
 if(t-lastOk>6000){samples=[];smooth=null}
 let raw=null;
 if(c.accuracy<=50){
  if(c.speed!=null&&c.speed>=0)raw=c.speed;
  if(c.accuracy<=30){track.push({...p,t});track=track.filter(x=>t-x.t<=5000);
   const a=track[0];if(raw==null&&t-a.t>=3000){const d=dist(a,p);raw=d<c.accuracy*.5?0:d/((t-a.t)/1000)}}}
 if(raw!=null){lastOk=t;samples.push(raw);if(samples.length>3)samples.shift();
  const m=[...samples].sort((x,y)=>x-y)[Math.floor(samples.length/2)];
  smooth=m<.9?0:smooth==null?m:smooth+.5*(m-smooth)}
 return smooth==null?null:Math.round(smooth*3.6)}
function update(g){document.body.classList.add('driving');const c=g.coords,t=g.timestamp;pos={lat:c.latitude,lon:c.longitude};
 const kmh=speedKmh(c,t,pos);
 if(kmh>5){if(c.heading!=null&&!isNaN(c.heading))heading=c.heading;else if(last&&dist(last,pos)>5)heading=bearing(last,pos)}
 last={...pos,t};
 $('kmh').textContent=kmh??'–';$('speed').classList.toggle('over',limit>0&&kmh>limit);
 if(!me){me=L.marker([pos.lat,pos.lon],{icon:L.divIcon({className:'arrow',html:'<div></div>',iconSize:null}),zIndexOffset:1000}).addTo(map);map.setView([pos.lat,pos.lon],17)}
 else{me.setLatLng([pos.lat,pos.lon]);if(follow)map.panTo([pos.lat,pos.lon])}
 if(heading!=null&&me.getElement())me.getElement().firstChild.style.transform=`rotate(${heading}deg)`;
 guide();
 fetchCams();check();share()}
$('go').onclick=async()=>{
 try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}
 try{await navigator.wakeLock.request('screen')}catch(e){}
 if(watching)return;
 if(!navigator.geolocation){$('status').textContent='Ez a böngésző nem ad helyadatot.';return}
 watching=true;$('status').textContent='GPS keresése…';
 navigator.geolocation.watchPosition(update,e=>{$('status').textContent=e.code===1?'Engedélyezd a helymeghatározást a beállításokban.':'Gyenge GPS-jel.'},{enableHighAccuracy:true,maximumAge:1000})};
document.addEventListener('visibilitychange',()=>{if(watching&&!document.hidden)navigator.wakeLock?.request('screen').catch(()=>{})});
function add(type){if(!pos){$('status').textContent='Előbb nyomd meg az Indulás gombot.';return}
 mine.push({lat:pos.lat,lon:pos.lon,type});save('konvoj.pins',mine);warned.set(pos.lat+','+pos.lon,Date.now());draw();$('status').textContent='Megjelölve.'}
$('addCam').onclick=()=>add('cam');$('addGate').onclick=()=>add('gate');
const showLim=()=>$('lim').textContent=limit?'limit: '+limit:'';
$('setLim').onclick=()=>{const v=prompt('Sebességhatár km/h (0 = ki)',limit);if(v===null)return;limit=Math.max(0,parseInt(v)||0);save('konvoj.limit',limit);showLim()};
showLim();draw();
let needHelp=false,meetMarker=null,picking=false;const helped=new Set();
let team=load('konvoj.team',null),lastSent=0,moving=false;
const friends=L.layerGroup().addTo(map),pins=new Map();
const url=id=>`${DB_URL}/groups/${team.code}${id?'/'+id:''}.json`;
function share(){const m=(pos&&last&&Number($('kmh').textContent)>5)||false;
 if(!team||!DB_URL||Date.now()-lastSent<5000)return;lastSent=Date.now();moving=m;
 fetch(url(team.id),{method:'PUT',body:JSON.stringify({name:team.name,lat:pos.lat,lon:pos.lon,moving,help:needHelp,time:{'.sv':'timestamp'}})})
  .then(r=>{if(!r.ok)throw 0}).catch(()=>$('status').textContent='A helyed megosztása nem sikerült.')}
function info(f){const d=document.createElement('div'),age=Math.max(0,Math.round((Date.now()-f.time)/1000));
 [String(f.name).slice(0,20),f.help===true?'⚠️ Gond van, megállt vagy lemaradt':'',f.moving?'Úton van':'Áll',pos?(dist(pos,f)/1000).toFixed(1)+' km-re tőled':'',age<60?'Most frissült':Math.round(age/60)+' perce frissült']
 .forEach((t,i)=>{if(!t)return;const e=document.createElement(i?'div':'b');e.textContent=t;d.appendChild(e)});return d}
async function pull(){if(!team||!DB_URL||document.hidden)return;
 try{const r=await fetch(url());if(!r.ok)throw 0;const all=await r.json()||{},seen=new Set();
  for(const[id,f]of Object.entries(all)){if(id==='meet'||id===team.id||!Number.isFinite(f.lat)||!Number.isFinite(f.lon)||Date.now()-f.time>600000)continue;seen.add(id);
   let m=pins.get(id);if(!m){m=L.circleMarker([f.lat,f.lon],{radius:10,color:'#fff',fillColor:'#00c27a',fillOpacity:1}).bindPopup('').addTo(friends);pins.set(id,m)}
   m.setLatLng([f.lat,f.lon]);m.setPopupContent(info(f));m.setStyle({fillColor:f.help===true?'#ff2d2d':'#00c27a'});
   if(f.help!==true)helped.delete(id);else if(!helped.has(id)){helped.add(id);beep();$('status').textContent='⚠️ '+String(f.name).slice(0,20)+': gond van! Koppints a piros pontra.'}}
  members=[...seen].map(id=>all[id]);renderList();
  showMeet(all.meet);
  for(const[id,m]of pins)if(!seen.has(id)){friends.removeLayer(m);pins.delete(id)}}
 catch(e){$('status').textContent='A csapat adatai nem töltődtek be.'}}
let members=[];
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(16).padStart(2,'0')).join('');
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function action(text,fn,cls){const b=el('button',text,cls);b.type='button';b.onclick=fn;return b}
function join(isNew,nameBox,codeBox){const name=nameBox.value.trim().slice(0,20),code=isNew?rnd():codeBox.value.trim().toLowerCase();
 if(!name){$('msg').textContent='Írd be a neved.';return}
 if(!/^[a-f0-9]{20}$/.test(code)){$('msg').textContent='Hibás csapatkód (20 karakter).';return}
 team={name,code,id:rnd()};save('konvoj.team',team);members=[];lastSent=0;if(pos)share();renderTeam();pull()}
function leave(){if(!confirm('Biztosan kilépsz a csapatból?'))return;fetch(url(team.id),{method:'DELETE'}).catch(()=>{});
 team=null;members=[];needHelp=false;showHelp();showMeet(null);save('konvoj.team',null);friends.clearLayers();pins.clear();renderTeam()}
function renderList(){const box=$('members');if(!box||!team)return;box.replaceChildren();
 const me_=el('div',null,'member');me_.append(el('b',team.name+' (te)'),el('small',watching&&pos?'Megosztod a helyed':'Nyomd meg az Indulás gombot, hogy lássanak'));box.append(me_);
 members.forEach(f=>{const age=Math.max(0,Math.round((Date.now()-f.time)/60000));
  const row=action('',()=>{follow=false;map.setView([f.lat,f.lon],16);$('panel').hidden=true},'member'+(f.help===true?' sos':''));
  row.append(el('b',String(f.name).slice(0,20)),el('small',[f.help===true?'⚠️ Gond van':f.moving?'Úton van':'Áll',pos?kmTxt(dist(pos,f))+' tőled':'',age?age+' perce':'most'].filter(Boolean).join(' · ')));box.append(row)});
 $('count').textContent='Résztvevők: '+(members.length+1)}
function renderTeam(){const p=$('panel');p.replaceChildren();
 const head=el('div',null,'head');head.append(el('h2','Csapat'),action('✕',()=>p.hidden=true,'x'));p.append(head);
 if(!DB_URL){p.append(el('p','A csapat funkció még nincs bekapcsolva: hiányzik az adatbázis címe (Firebase).'));return}
 if(!team){const n=el('input'),c=el('input');n.placeholder='A neved';n.maxLength=20;c.placeholder='Csapatkód (ha kaptál)';c.autocapitalize='off';c.autocomplete='off';
  const m=el('p');m.id='msg';
  p.append(el('p','Aki ismeri a csapatkódot, látja a résztvevők helyét. Csak barátnak küldd el.'),n,action('Új csapat létrehozása',()=>join(true,n),'main'),c,action('Csatlakozás kóddal',()=>join(false,n,c)),m);return}
 const copy=action('Csapatkód másolása',async()=>{try{await navigator.clipboard.writeText(team.code);copy.textContent='Kimásolva ✓'}catch(e){prompt('Csapatkód:',team.code)}},'main');
 const count=el('h3');count.id='count';const list=el('div');list.id='members';
 p.append(el('code',team.code),copy,count,list,action('Kilépés a csapatból',leave,'leave'));renderList()}
$('team').onclick=()=>{$('panel').hidden=false;renderTeam()};
setInterval(pull,5000);
function showMeet(p){if(!p||!Number.isFinite(p.lat)||!Number.isFinite(p.lon)){if(meetMarker){map.removeLayer(meetMarker);meetMarker=null}return}
 if(!meetMarker)meetMarker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'pin',html:'🏁',iconSize:[30,30]})}).bindPopup('').addTo(map);
 meetMarker.setLatLng([p.lat,p.lon]);const d=document.createElement('div');
 d.textContent='Találkozópont'+(pos?': '+(dist(pos,p)/1000).toFixed(1)+' km légvonalban':'');
 const a=document.createElement('a');a.textContent='Útvonal megnyitása';a.target='_blank';a.rel='noopener';a.href=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
 const b=document.createElement('button');b.textContent='Törlés';b.onclick=()=>{fetch(url('meet'),{method:'DELETE'});showMeet(null)};
 d.append(document.createElement('br'),a,document.createElement('br'),b);meetMarker.setPopupContent(d)}
function showHelp(){$('help').querySelector('span').textContent=needHelp?'Rendben':'Gond van';$('help').classList.toggle('on',needHelp)}
function ready(){if(team&&DB_URL)return true;$('status').textContent='Előbb lépj be egy csapatba.';return false}
$('help').onclick=()=>{if(!ready())return;if(!pos){$('status').textContent='Előbb nyomd meg az Indulás gombot.';return}needHelp=!needHelp;showHelp();lastSent=0;share()};
$('meet').onclick=()=>{if(!ready())return;picking=true;$('status').textContent='Koppints a térképre a találkozópont helyén.'};
let follow=true,dest=null,destMarker=null,route=[],lines=[],lastRoute=0,routeId=0;
map.on('dragstart',()=>follow=false);
$('center').onclick=()=>{follow=true;if(pos)map.setView([pos.lat,pos.lon],17)};
const kmTxt=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
function clearDest(){routeId++;dest=null;route=[];lines.forEach(l=>map.removeLayer(l));lines=[];if(destMarker)map.removeLayer(destMarker);destMarker=null;$('nav').style.display='none'}
function setDest(p){clearDest();dest=p;const b=document.createElement('button');b.textContent='Úti cél törlése';b.onclick=()=>{map.closePopup();clearDest()};
 destMarker=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'dest',html:'<div></div>',iconSize:null})}).bindPopup(b).addTo(map);
 if(pos)getRoute(true);else{map.setView([p.lat,p.lon],15);follow=false;$('status').textContent='Útvonalhoz nyomd meg az Indulás gombot.'}}
async function getRoute(fit){if(!dest||!pos)return;lastRoute=Date.now();const id=++routeId;
 try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${pos.lon},${pos.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson`);if(!r.ok)throw 0;
  const x=(await r.json()).routes[0];if(id!==routeId)return;
  route=x.geometry.coordinates.map(c=>({lat:c[1],lon:c[0]}));lines.forEach(l=>map.removeLayer(l));
  const ll=route.map(p=>[p.lat,p.lon]);lines=[L.polyline(ll,{color:'#2a0838',weight:13,opacity:.9}).addTo(map),L.polyline(ll,{color:'#d94bff',weight:7,opacity:1}).addTo(map)];
  $('nav').style.display='block';$('nav').textContent=`${kmTxt(x.distance)} · kb. ${Math.max(1,Math.round(x.duration/60))} perc`;
  if(fit){follow=false;map.fitBounds(lines[1].getBounds(),{padding:[60,120]})}}
 catch(e){if(id===routeId)$('status').textContent='Az útvonaltervezés most nem sikerült.'}}
function guide(){if(!dest)return;if(dist(pos,dest)<40){clearDest();$('status').textContent='Megérkeztél!';return}
 if(Date.now()-lastRoute<20000)return;
 if(!route.length){getRoute();return}
 let best=0,bd=Infinity;route.forEach((p,i)=>{const d=dist(pos,p);if(d<bd){bd=d;best=i}});
 if(bd>150){getRoute();return}
 let left=bd;for(let i=best+1;i<route.length;i++)left+=dist(route[i-1],route[i]);
 $('nav').textContent=kmTxt(left)+' a célig'}
$('search').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;$('q').blur();$('status').textContent='Keresés…';
 try{const near=pos?`&viewbox=${pos.lon-1},${pos.lat+1},${pos.lon+1},${pos.lat-1}`:'';
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=hu${near}&q=${encodeURIComponent(q)}`);if(!r.ok)throw 0;const[x]=await r.json();
  if(!x){$('status').textContent='Nincs ilyen találat.';return}$('status').textContent=x.display_name;setDest({lat:+x.lat,lon:+x.lon})}
 catch(err){$('status').textContent='A keresés most nem sikerült.'}};
map.on('contextmenu',e=>{if(!picking)setDest({lat:e.latlng.lat,lon:e.latlng.lng})});
map.on('click',e=>{if(!picking||!team)return;picking=false;const p={lat:e.latlng.lat,lon:e.latlng.lng};
 fetch(url('meet'),{method:'PUT',body:JSON.stringify(p)}).then(r=>{if(!r.ok)throw 0;showMeet(p);$('status').textContent='Találkozópont beállítva.'}).catch(()=>$('status').textContent='Nem sikerült menteni.')});
// álló helyzetben is frissül a megosztott helyed
setInterval(()=>{if(watching&&pos&&!document.hidden){if(last&&Date.now()-last.t>15000){$('kmh').textContent='0';samples=[];smooth=null;track=[]}share()}},30000);
</script></body></html>
