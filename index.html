let track=[],samples=[],smooth=null,lastOk=0;
function speedKmh(c,t,p){
 if(t-lastOk>6000){samples=[];smooth=null}
 let raw=null;
 if(c.accuracy<=50){
  if(c.speed!=null&&c.speed>=0)raw=c.speed;
  if(c.accuracy<=30){track.push({...p,t});track=track.filter(x=>t-x.t<=5000);
   const a=track[0];if(raw==null&&t-a.t>=3000){const d=dist(a,p);raw=d<c.accuracy*.5?0:d/((t-a.t)/1000)}}}
 if(raw!=null){lastOk=t;samples.push(raw);if(samples.length>3)samples.shift();
  const m=[...samples].sort((x,y)=>x-y)[Math.floor(samples.length/2)];
  smooth=m<.9?0:smooth==null?m:smooth+.5*(m-smooth)}

 setTimeout(()=>$('splash')?.remove(),2750)}}catch(e){$('splash')?.remove()}
// ---------- Frissítés ----------
setInterval(()=>{drawTrip();drawFriends();shareProfile();weather();askStill();
 if(wasHidden&&!invisible()){lastSent=0;if(pos&&watching)share()}wasHidden=invisible()},1000);
applyTheme(false);drawQuick();openInvite();
setInterval(gameSync,500);
setMap(load('konvoj.map2','neon'));applyGame();
fetch('veda.json?v='+V).then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{veda=a.map(([lat,lon,label])=>({lat,lon,label,type:'veda'}));draw()}).catch(()=>$('status').textContent='A traffipaxlista nem töltött be.');
// álló helyzetben is frissül a megosztott helyed
setInterval(()=>{if(watching&&pos&&!document.hidden){if(last&&Date.now()-last.t>15000){$('kmh').textContent='0';samples=[];smooth=null;track=[]}share()}},30000);
// ---------- Mindenki: a többi Konvoj-felhasználó (csak aki maga is bekapcsolta) ----------
// Az adatbázis nyilvános, ezért ide csak becenév, autórajz és kb. 300 méterre kerekített hely kerül, sebesség soha
const PUB='konvojpublicchannel1',PUB_NEAR=600;
let pubOn=load('konvoj.pub',false)===true,pubName=load('konvoj.pubName',''),pubId=load('konvoj.pubId','')||'',blocked=load('konvoj.blocked',[]),pubUsers=new Map(),pubSent=0,pubBusy=false,pubSeen=new Set(),pubMsgs=[];
const pubLayer=L.layerGroup().addTo(map),pubDots=new Map();
const pubUrl=path=>`${DB_URL}/groups/${PUB}/${path}.json`;
const pubNear=u=>!!pos&&dist(pos,u)<=PUB_NEAR;
const atHome=()=>!!(places.home&&pos&&dist(pos,places.home)<300);
const coarse=(v,step)=>Math.round((Math.round(v/step)*step)*1e5)/1e5;
function pubRemove(){if(pubId&&DB_URL){fetch(pubUrl('u/'+pubId),{method:'DELETE'}).catch(()=>{})}pubSent=0}
function pubClear(){pubUsers.clear();pubDots.forEach(m=>pubLayer.removeLayer(m));pubDots.clear();gameSync()}
function setPub(on){pubOn=on;save('konvoj.pub',on);
 if(on){pubId=rnd();save('konvoj.pubId',pubId);pubSeen.clear();pubMsgs=[];pubSent=0;pubTick()}
 else{pubRemove();if(pubId&&DB_URL)fetch(pubUrl('in/'+pubId),{method:'DELETE'}).catch(()=>{});pubClear()}}
async function pubTick(){if(!pubOn||!DB_URL||document.hidden||pubBusy)return;pubBusy=true;const me=pubId;
 try{if(invisible()||atHome()){if(pubSent)pubRemove()}
  else if(pos&&watching&&Date.now()-pubSent>14000){pubSent=Date.now();
   await fetch(pubUrl('u/'+me),{method:'PUT',body:JSON.stringify({name:pubName,lat:coarse(pos.lat,.003),lon:coarse(pos.lon,.0045),car:profile.car,color:profile.color,time:{'.sv':'timestamp'}})})}
  const get=async path=>{const r=await fetch(pubUrl(path));if(!r.ok)throw 0;return await r.json()||{}},[all,inbox]=await Promise.all([get('u'),get('in/'+me)]);
  if(!pubOn||me!==pubId)return;pubUsers.clear();
  for(const[id,u]of Object.entries(all)){const age=Date.now()-u.time;
   if(age>600000){fetch(pubUrl('u/'+id),{method:'DELETE'}).catch(()=>{});continue}
   if(id===me||blocked.includes(id)||age>90000||!Number.isFinite(u.lat)||!Number.isFinite(u.lon))continue;
   pubUsers.set(id,{id,lat:u.lat,lon:u.lon,name:cut(u.name||'Sofőr',20),car:u.car,color:u.color})}
  for(const[key,m]of Object.entries(inbox)){if(pubSeen.has(key))continue;pubSeen.add(key);
   if(!m||blocked.includes(m.from)||Date.now()-m.time>600000||typeof m.text!=='string')continue;
   const msg={from:String(m.from),name:cut(m.name||'Sofőr',20),text:cut(m.text,160)};pubMsgs=[...pubMsgs,msg].slice(-30);
   const line=msg.name+': '+msg.text;beep();say(line);navigator.vibrate?.(200);card('pubmsg',line,[['Válasz',()=>renderStranger(msg.from,msg.name)]])}
  pubDraw()}
 catch(e){}finally{pubBusy=false}}
function pubDraw(){pubDots.forEach((m,id)=>{if(!pubUsers.has(id)){pubLayer.removeLayer(m);pubDots.delete(id)}});
 pubUsers.forEach((u,id)=>{let m=pubDots.get(id);if(!m){m=L.circleMarker([u.lat,u.lon],{radius:8,color:'#fff',fillColor:'#ffb020',fillOpacity:1}).addTo(pubLayer);m.on?.('click',()=>renderStranger(id));pubDots.set(id,m)}m.setLatLng([u.lat,u.lon])});gameSync()}
function pubMarks(){pubUsers.forEach((u,id)=>{const o=mark('p'+id,u,'gstranger',()=>renderStranger(id)),e=o.m.getElement(),near=pubNear(u),svg=near?carSvg(u.car,u.color):'',look=near+u.name+u.car+u.color;
 if(e.dataset.look!==look){e.dataset.look=look;e.classList.toggle('near',near);e.innerHTML=svg||'';if(near)e.append(el('span',u.name,'glabel'))}})}
async function pubSend(to,text){text=cut(String(text).trim(),160);const u=pubUsers.get(to);
 if(!text||!pubOn)return false;if(!u||!pubNear(u)){$('status').textContent='Már nincs a közeledben.';return false}
 try{const r=await fetch(pubUrl('in/'+to),{method:'POST',body:JSON.stringify({from:pubId,name:pubName,text,time:{'.sv':'timestamp'}})});if(!r.ok)throw 0;$('status').textContent='Elküldve.';return true}
 catch(e){$('status').textContent='Nem sikerült elküldeni.';return false}}
const poked=new Map();
function renderStranger(id,name){const u=pubUsers.get(id),near=u&&pubNear(u),p=sheet(near?u.name:name||'Konvoj-felhasználó',false);
 pubMsgs.filter(m=>m.from===id).slice(-6).forEach(m=>p.append(el('p',m.name+': '+m.text)));
 if(!near){p.append(el('p',u?'Még messze van. A nevét és az autóját akkor látod, és akkor tudsz neki írni, ha a közelébe érsz (kb. 600 m).':'Ez a felhasználó most nem látható.'))}
 else{const svg=carSvg(u.car,u.color);if(svg){const pic=el('div',null,'strcar');pic.innerHTML=svg;p.append(pic)}p.append(el('p','A közeledben van, nagyjából '+kmTxt(Math.max(100,Math.round(dist(pos,u)/100)*100))+'.'),
  tap('hand','Megbököm',()=>{if(Date.now()-(poked.get(id)||0)<30000){$('status').textContent='Az előbb böktél meg, várj egy kicsit.';return}poked.set(id,Date.now());pubSend(id,'Megbökött téged!')},'main'));
  const quick=el('div',null,'quick');['Szia!','Menő a verda!','Gyere a parkolóba','Mizu?'].forEach(q=>quick.append(action(q,()=>pubSend(id,q))));p.append(quick);
  if(rolling())p.append(el('p','Menet közben írni nem lehet, csak a kész üzenetek mennek.'));
  else{const form=el('form'),input=el('input');input.placeholder='Üzenet neki';input.maxLength=160;input.enterKeyHint='send';form.append(input,el('button','Küldés','main'));
   form.onsubmit=async e=>{e.preventDefault();if(!rolling()&&await pubSend(id,input.value))input.value=''};p.append(form)}}
 if(u||name)p.append(action('Letiltom, nem akarom látni',()=>{blocked=[...blocked,id].slice(-200);save('konvoj.blocked',blocked);pubUsers.delete(id);pubMsgs=pubMsgs.filter(m=>m.from!==id);pubDraw();p.hidden=true},'leave'))}
function renderPublic(){const p=sheet('Mindenki');
 if(!DB_URL){p.append(el('p','Ehhez hiányzik az adatbázis.'));return}
 if(!pubOn){const n=el('input');n.placeholder='Beceneved (ezt látják)';n.maxLength=20;n.value=pubName||team?.name||'';const m=el('p');
  p.append(el('p','Ha bekapcsolod, látod a többi felhasználót, akik szintén bekapcsolták, és ők is látnak téged a térképen.'),
   el('p','Idegenek is lehetnek köztük. Csak a becenevedet, az autód rajzát és a kb. 300 méterre kerekített helyedet osztjuk meg, a sebességedet nem. Az adat és az üzenet nem titkos, ne írj le semmi személyeset. A mentett Otthonod 300 méteres körzetében rejtve maradsz.'),n,
   action('Bekapcsolom',()=>{const v=n.value.trim().slice(0,20);if(!v){m.textContent='Írj be egy becenevet.';return}pubName=v;save('konvoj.pubName',v);setPub(true);renderPublic()},'main'),m);return}
 p.append(el('p',!watching?'Nyomd meg az Indulás gombot, hogy te is látszódj.':invisible()?'Láthatatlan módban vagy, most nem látnak.':atHome()?'Otthon vagy, ezért most rejtve maradsz.':'Látható vagy mint '+pubName+'.'),el('p','Felhasználók a térképen: '+pubUsers.size));
 const near=[...pubUsers.values()].filter(pubNear);p.append(el('h3','A közeledben'));
 if(!near.length)p.append(el('p','Most senki sincs a közeledben.'));near.forEach(u=>p.append(action(u.name,()=>renderStranger(u.id),'main')));
 if(blocked.length)p.append(action(`Letiltások törlése (${blocked.length})`,()=>{blocked=[];save('konvoj.blocked',blocked);renderPublic()}));
 p.append(action('Kikapcsolom',()=>{setPub(false);renderPublic()},'leave'))}
setInterval(pubTick,5000);pubTick();
</script></body></html>
